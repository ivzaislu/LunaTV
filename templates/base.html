<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>{% block title %}LunaTV{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        color-scheme: dark light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        background: linear-gradient(135deg, #1e293b, #0f172a);
        box-shadow: 0 4px 18px rgba(15, 23, 42, 0.4);
        position: sticky;
        top: 0;
        z-index: 20;
      }
      .topbar {
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px 24px 12px;
      }
      .topbar h1 {
        margin: 0;
        font-size: 2rem;
      }
      nav {
        display: flex;
        gap: 12px;
        padding: 12px 24px 20px;
        max-width: 1100px;
        margin: 0 auto;
        flex-wrap: wrap;
      }
      nav a {
        padding: 10px 18px;
        border-radius: 999px;
        text-decoration: none;
        color: #cbd5f5;
        font-weight: 600;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid transparent;
        transition: all 0.2s ease;
      }
      nav a:hover {
        background: rgba(56, 189, 248, 0.2);
        color: #f8fafc;
      }
      nav a.active {
        background: #38bdf8;
        color: #0f172a;
        border-color: rgba(148, 163, 184, 0.25);
        box-shadow: 0 8px 24px rgba(56, 189, 248, 0.35);
      }
      main {
        flex: 1;
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        padding: 28px 24px 48px;
      }
      .card {
        background: rgba(15, 23, 42, 0.85);
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.55);
        border: 1px solid rgba(148, 163, 184, 0.12);
        backdrop-filter: blur(6px);
      }
      .card h2 {
        margin-top: 0;
      }
      .muted {
        color: rgba(148, 163, 184, 0.7);
        font-size: 0.9rem;
      }
      ul.clean {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 12px;
      }
      .badge {
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: rgba(148, 163, 184, 0.7);
      }
      .status-ok {
        color: #34d399;
      }
      .status-fail {
        color: #f87171;
      }
      .status-running {
        color: #fbbf24;
      }
      button.primary {
        align-self: flex-start;
        padding: 10px 18px;
        border-radius: 999px;
        border: none;
        background: #38bdf8;
        color: #0f172a;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(56, 189, 248, 0.4);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      button.primary:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 10px 24px rgba(56, 189, 248, 0.55);
      }
      button.primary:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        box-shadow: none;
      }
      form.stacked {
        display: grid;
        gap: 16px;
        max-width: 520px;
      }
      form.stacked label {
        display: grid;
        gap: 8px;
        font-weight: 600;
      }
      form.stacked input,
      form.stacked select,
      form.stacked textarea {
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: rgba(15, 23, 42, 0.6);
        color: #e2e8f0;
        font: inherit;
      }
      form.stacked input:focus,
      form.stacked select:focus,
      form.stacked textarea:focus {
        outline: 2px solid rgba(56, 189, 248, 0.35);
        border-color: rgba(56, 189, 248, 0.45);
      }
      pre.viewer {
        white-space: pre-wrap;
        font-family: 'Fira Code', 'SFMono-Regular', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
        background: rgba(15, 23, 42, 0.85);
        padding: 16px;
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.12);
        max-height: 360px;
        overflow: auto;
      }
      table.data {
        width: 100%;
        border-collapse: collapse;
        background: rgba(15, 23, 42, 0.85);
        border-radius: 12px;
        overflow: hidden;
      }
      table.data thead {
        background: rgba(30, 41, 59, 0.65);
        text-align: left;
      }
      table.data th, table.data td {
        padding: 12px 14px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.1);
      }
      table.data tr:last-child td {
        border-bottom: none;
      }
      dl.key-values {
        display: grid;
        grid-template-columns: minmax(140px, 200px) 1fr;
        gap: 10px 16px;
        margin: 0;
      }
      dl.key-values dt {
        font-weight: 600;
      }
      dl.key-values dd {
        margin: 0;
        color: rgba(148, 163, 184, 0.8);
      }
      .player-shell {
        background: rgba(15, 23, 42, 0.7);
        border-radius: 16px;
        padding: 12px;
        border: 1px solid rgba(148, 163, 184, 0.12);
        margin-bottom: 16px;
      }
      .player-shell video {
        width: 100%;
        max-height: 420px;
        border-radius: 12px;
        background: #000;
      }
      footer {
        padding: 24px;
        text-align: center;
        color: rgba(148, 163, 184, 0.45);
      }
      @media (max-width: 720px) {
        nav {
          flex-wrap: wrap;
          justify-content: center;
        }
        nav a {
          flex: 1 1 auto;
          text-align: center;
        }
        .topbar {
          text-align: center;
        }
      }
    </style>
    {% block head %}{% endblock %}
  </head>
  <body>
    <header>
      <div class="topbar">
        <h1>📺 LunaTV</h1>
        <div class="badge">http://{{ host }}:{{ port }}</div>
      </div>
      <nav>
        <a href="{{ url_for('dashboard') }}" class="{% if active_page == 'dashboard' %}active{% endif %}">Панель</a>
        <a href="{{ url_for('playlists_page') }}" class="{% if active_page == 'playlists' %}active{% endif %}">Плейлисты</a>
        <a href="{{ url_for('channels_page') }}" class="{% if active_page == 'channels' %}active{% endif %}">Каналы</a>
        <a href="{{ url_for('player_page') }}" class="{% if active_page == 'player' %}active{% endif %}">Плеер</a>
        <a href="{{ url_for('scanner_page') }}" class="{% if active_page == 'scanner' %}active{% endif %}">Сканер</a>
        <a href="{{ url_for('settings_page') }}" class="{% if active_page == 'settings' %}active{% endif %}">Настройки</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer>
      LunaTV © {{ year }} — управление потоками и плейлистами из браузера
    </footer>
    {% block scripts %}{% endblock %}
  </body>
</html>
