name: LunaTV CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - agent/fix-iptv-sources

concurrency:
  group: lunatv-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: LunaTV CI under global lock
        shell: bash
        run: |
          echo "Waiting for global CI lock..."
          flock -x /shared-lock/global.lock bash -lc '
            set -Eeuo pipefail
            echo "Global CI lock acquired: LunaTV"

            cd "$GITHUB_WORKSPACE"
            IMAGE="lunatv-ci:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

            cleanup() {
              docker image rm -f "$IMAGE" >/dev/null 2>&1 || true
            }
            trap cleanup EXIT

            docker build -t "$IMAGE" .
            docker run --rm "$IMAGE" bash -lc "
              set -Eeuo pipefail
              npm test
              python -m unittest discover
              python -m compileall update_playlist.py scaner.py proxy_server.py tests scripts
              python -m unittest tests.test_m3u_integrity
            "

            if [[ "${GITHUB_REF:-}" == "refs/heads/agent/fix-iptv-sources" ]]; then
              echo "Running warm-browser live source diagnostics (SLA <= 5s)"
              smoke_status=0

              docker run --rm "$IMAGE" bash -lc "
                set -u
                rm -f /tmp/lunatv-playwright-ws
                node extractor/shared-browser-server.js >/tmp/lunatv-browser.log 2>&1 &
                browser_pid=\$!
                cleanup_browser() {
                  kill \"\$browser_pid\" >/dev/null 2>&1 || true
                  wait \"\$browser_pid\" >/dev/null 2>&1 || true
                }
                trap cleanup_browser EXIT
                ready=0
                for _ in \$(seq 1 300); do
                  if [[ -s /tmp/lunatv-playwright-ws ]]; then ready=1; break; fi
                  if ! kill -0 \"\$browser_pid\" >/dev/null 2>&1; then break; fi
                  sleep 0.1
                done
                if [[ \"\$ready\" -ne 1 ]]; then
                  echo \"Shared Chromium failed to become ready\"
                  cat /tmp/lunatv-browser.log || true
                  exit 1
                fi
                echo \"Shared Chromium ready\"

                echo \"Production-config smoke with warm browser\"
                python scripts/source_smoke.py --timeout 5 --samples-per-host 2 || true

                echo \"Universal extractor warm-browser probes\"
                python scripts/source_probe_slugs.py \\
                  dom-kino-smotru \\
                  tv-1000-oneliketv \\
                  sony-sci-fi-viks \\
                  dom-kino-tivix \\
                  russkii-roman-telik \\
                  sts-domatv \\
                  nba-tv-mediamaniya \\
                  --timeout 5 \\
                  --extractor universal-playwright-extractor.js || exit 1

                echo \"SmotretTV warm-browser probe\"
                python scripts/source_probe_slugs.py \\
                  setanta-qazaqstan-smotrettv \\
                  --timeout 5 || exit 1
              " || smoke_status=1

              echo "Running live CDN header-profile diagnostics"
              docker run --rm "$IMAGE" bash -lc "
                set -u
                python scripts/cdn_live_diag.py \\
                  dom-kino-smotru \\
                  tv-1000-oneliketv \\
                  russkii-roman-telik \\
                  --timeout 1.5
              " || true

              if [[ "$smoke_status" -ne 0 ]]; then
                echo "One or more warm-browser live probes failed the <=5s SLA"
              fi
            fi

            echo "LunaTV CI finished; releasing global lock"
          '
