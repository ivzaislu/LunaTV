name: tests

on:
  push:
    branches:
      - main
      - agent/fix-iptv-sources
  pull_request:

concurrency:
  group: lunatv-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Verify self-hosted runner tools
        run: |
          set -euo pipefail
          command -v flock
          command -v python
          command -v node
          command -v npm

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: JavaScript tests
        run: npm test

      - name: Python tests
        run: python -m unittest discover

      - name: Python syntax check
        run: python -m compileall update_playlist.py scaner.py proxy_server.py tests scripts

      - name: Locked live source diagnostics
        if: github.ref == 'refs/heads/agent/fix-iptv-sources'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          LOCK_FILE="${LUNATV_SMOKE_LOCK:-/tmp/lunatv-live-smoke.lock}"
          echo "Waiting for live-source lock: ${LOCK_FILE}"
          flock -w 900 "${LOCK_FILE}" bash -euo pipefail <<'LOCKED'
            echo "Acquired live-source lock"

            npx --yes playwright@1.55.0 install chromium

            overall=0

            echo "== configured sources =="
            python scripts/source_smoke.py --timeout 15 || overall=1

            echo "== unresolved sources, 3 samples each =="
            python scripts/source_smoke.py \
              --hosts smotru.tv mediamaniya.ru smotrettv.com oneliketv.net live.domatv.net \
              --timeout 12 \
              --samples-per-host 3 || overall=1

            echo "== universal extractor diagnostics =="
            python scripts/source_smoke.py \
              --hosts smotru.tv mediamaniya.ru smotrettv.com oneliketv.net \
              --timeout 12 \
              --samples-per-host 2 \
              --extractor universal-playwright-extractor.js || overall=1

            echo "== protected CDN browser fallback diagnostics =="
            python scripts/source_smoke.py \
              --hosts smotru.tv oneliketv.net \
              --timeout 15 \
              --samples-per-host 2 \
              --extractor cdn-browser-extractor.js || overall=1

            exit "${overall}"
          LOCKED
