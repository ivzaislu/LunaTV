name: tests

on:
  push:
    branches:
      - main
      - agent/fix-iptv-sources
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: JavaScript tests
        run: npm test

      - name: Python tests
        run: python -m unittest discover

      - name: Python syntax check
        run: python -m compileall update_playlist.py scaner.py proxy_server.py tests scripts

      - name: Install Chromium for source smoke tests
        if: github.ref == 'refs/heads/agent/fix-iptv-sources'
        run: npx --yes playwright@1.55.0 install chromium

      - name: Live source smoke tests
        if: github.ref == 'refs/heads/agent/fix-iptv-sources'
        continue-on-error: true
        run: python scripts/source_smoke.py --timeout 15

      - name: Diagnose failed sources with universal extractor
        if: github.ref == 'refs/heads/agent/fix-iptv-sources'
        continue-on-error: true
        run: >-
          python scripts/source_smoke.py
          --hosts smotru.tv mediamaniya.ru ip.tivix.co smotrettv.com telik.live oneliketv.net
          --timeout 12
          --extractor universal-playwright-extractor.js
